<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <rect width="1200" height="1500" fill="#fff"/>
  <rect x="18" y="18" width="1164" height="1464" fill="none" stroke="#111" stroke-width="5"/>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700">Government of India, Ministry of Railways</text>
  <text x="600" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700">Railway Recruitment Boards</text>
  <rect x="90" y="162" width="1020" height="58" fill="#111"/>
  <text x="600" y="202" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">CENTRALISED EMPLOYMENT NOTIFICATION (CEN) No. 05/2026</text>
  <text x="600" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="700" text-decoration="underline">Recruitment to various posts of Paramedical Categories</text>
  <text x="600" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700">(Indicative Short Notice)</text>
  <line x1="90" y1="365" x2="1110" y2="365" stroke="#111" stroke-width="3"/>
  <text x="100" y="425" font-family="Arial, sans-serif" font-size="28">Applications are invited from eligible candidates for various</text>
  <text x="100" y="468" font-family="Arial, sans-serif" font-size="28">paramedical categories through online mode only.</text>
  <text x="100" y="548" font-family="Arial, sans-serif" font-size="28" font-weight="700">Opening date (Tentative): 15/09/2026</text>
  <text x="100" y="594" font-family="Arial, sans-serif" font-size="28" font-weight="700">Closing date (Tentative): 14/10/2026, 23:59 hrs</text>
  <rect x="90" y="660" width="1020" height="220" fill="#f4f4f4" stroke="#111" stroke-width="3"/>
  <line x1="90" y1="735" x2="1110" y2="735" stroke="#111" stroke-width="3"/>
  <line x1="650" y1="660" x2="650" y2="880" stroke="#111" stroke-width="3"/>
  <text x="370" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700">Name of the post</text>
  <text x="880" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700">Tentative Vacancies</text>
  <text x="370" y="810" text-anchor="middle" font-family="Arial, sans-serif" font-size="27">Various Posts of</text>
  <text x="370" y="848" text-anchor="middle" font-family="Arial, sans-serif" font-size="27">Paramedical Categories</text>
  <text x="880" y="825" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700">560</text>
  <text x="100" y="965" font-family="Arial, sans-serif" font-size="29" font-weight="700">Note:</text>
  <text x="100" y="1015" font-family="Arial, sans-serif" font-size="26">This notice is indicative in nature. The detailed CEN 05/2026</text>
  <text x="100" y="1055" font-family="Arial, sans-serif" font-size="26">notification, eligibility, post-wise vacancies and other conditions</text>
  <text x="100" y="1095" font-family="Arial, sans-serif" font-size="26">will be published on the official websites of Railway Recruitment Boards.</text>
  <text x="100" y="1185" font-family="Arial, sans-serif" font-size="27" font-weight="700">Previous recruitment vacancies: 434</text>
  <text x="100" y="1270" font-family="Arial, sans-serif" font-size="25">Official application portal: https://www.rrbapply.gov.in</text>
  <text x="100" y="1360" font-family="Arial, sans-serif" font-size="26" font-weight="700">Date: 12/09/2026</text>
  <text x="600" y="1435" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700">BEWARE OF TOUTS, BROKERS AND JOB RACKETEERS</text>
</svg>
